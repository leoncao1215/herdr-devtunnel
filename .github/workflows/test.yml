name: Offline tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm run check
      - run: npm test
        env:
          # Explicit opt-in: create/inspect/delete a unique DISABLED scratch task.
          # It never starts a process, logs in, or touches an existing task.
          HERDR_TEST_WINDOWS_TASKS: ${{ runner.os == 'Windows' && '1' || '0' }}
